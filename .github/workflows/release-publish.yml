name: Publish release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Candidate run containing both successful platform build artifacts
        required: true
        type: string
      commit:
        description: Exact candidate commit to tag and release
        required: true
        type: string
      release_version:
        description: New semver version to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.0
      - name: Verify candidate identity, platform builds, version, and release authority
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.argv[1])) process.exit(1)' "$RELEASE_VERSION"
          test "$EXPECTED_COMMIT" = "$(git rev-parse HEAD)"
          test "$(node -p "require('./cli/package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./desktop/ambient-orb/package.json').version")" = "$RELEASE_VERSION"
          gh run view "$CANDIDATE_RUN_ID" --json headSha,jobs,name > candidate-run.json
          test "$(jq -r .name candidate-run.json)" = "Release candidate evidence"
          test "$(jq -r .headSha candidate-run.json)" = "$EXPECTED_COMMIT"
          test "$(jq '[.jobs[] | select(.name | startswith("platform-candidate (macos-14, darwin, darwin-arm64")) | select(.conclusion == "success")] | length' candidate-run.json)" = "1"
          test "$(jq '[.jobs[] | select(.name | startswith("platform-candidate (windows-latest, win32, win32-x64")) | select(.conclusion == "success")] | length' candidate-run.json)" = "1"
          npm whoami
          if npm view "nova-audio-agent@$RELEASE_VERSION" version > existing-version.txt 2> npm-view-error.txt; then
            echo "nova-audio-agent@$RELEASE_VERSION already exists" >&2
            exit 1
          fi
          grep -q 'E404' npm-view-error.txt
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$RELEASE_VERSION already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Git tag v$RELEASE_VERSION already exists" >&2
            exit 1
          fi
      - name: Download and verify the candidate build matrix
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          gh run download "$CANDIDATE_RUN_ID" --name candidate-darwin-arm64 --dir downloaded/candidate-darwin-arm64
          gh run download "$CANDIDATE_RUN_ID" --name candidate-win32-x64 --dir downloaded/candidate-win32-x64
          node desktop/ambient-orb/scripts/assemble-release-artifact-root.mjs --input downloaded --output release-artifacts
          node desktop/ambient-orb/scripts/generate-release-manifest.mjs \
            --artifact-root release-artifacts \
            --commit "$EXPECTED_COMMIT" \
            --output release-artifacts/release-manifest-v1.json
      - name: Pack and audit the public npm package
        run: |
          set -euo pipefail
          mkdir npm-package npm-smoke
          npm pack ./cli --pack-destination npm-package
          tarball="$(find npm-package -maxdepth 1 -name '*.tgz' -type f)"
          test -n "$tarball"
          tarball="$(realpath "$tarball")"
          npm install --prefix npm-smoke --ignore-scripts "$tarball"
          test "$(npm-smoke/node_modules/.bin/novaaudio --version)" = "${{ inputs.release_version }}"
          npm-smoke/node_modules/.bin/novaaudio --help
      - name: Create GitHub release, publish npm package, and verify propagation
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" release-artifacts/* \
            --target "$EXPECTED_COMMIT" \
            --title "Nova Audio Agent v$RELEASE_VERSION" \
            --notes "Nova Audio Agent v$RELEASE_VERSION updates the project documentation and improves Windows Codex project reliability. This release includes unsigned macOS arm64 and Windows x64 portable applications plus installers; macOS Gatekeeper and Windows SmartScreen may display security warnings." \
            --latest
          tarball="$(find npm-package -maxdepth 1 -name '*.tgz' -type f)"
          tarball="$(realpath "$tarball")"
          npm publish "$tarball" --access public
          published=''
          for attempt in $(seq 1 12); do
            if test "$(npm view "nova-audio-agent@$RELEASE_VERSION" version 2>/dev/null || true)" = "$RELEASE_VERSION"; then
              published=1
              break
            fi
            sleep 10
          done
          test "$published" = "1"
          prefix="$(mktemp -d)"
          npm install --global --prefix "$prefix" "nova-audio-agent@$RELEASE_VERSION"
          test "$("$prefix/bin/novaaudio" --version)" = "$RELEASE_VERSION"
          "$prefix/bin/novaaudio" --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ inputs.release_version }}-publish-audit
          path: |
            candidate-run.json
            release-artifacts/release-manifest-v1.json
            release-artifacts/release-manifest-v1.json.sha256
          if-no-files-found: warn

name: Unsigned Windows package and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin the audited VS2022 toolchain; windows-latest now rolls to
          # Visual Studio 2026 and is not a reproducible native build input.
          - os: windows-2022
            target_id: win32-x64
            package_script: package:win
            artifact_name: unsigned-win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check
      # The complete runtime suite includes POSIX uid/mode and descriptor-lock
      # contracts. Windows is covered below by the desktop/native build and by
      # the checkout-free installed NSIS smoke, which exercises the packaged
      # Windows authorities instead of pretending POSIX permissions exist.
      - run: npm run test:runtime
        if: runner.os != 'Windows'
      - run: npm run test:desktop
        if: runner.os != 'Windows'
      - run: npm run build
      - name: Build unsigned native package bytes
        run: npm run ${{ matrix.package_script }} --workspace @nova-audio-agent/ambient-orb
      - name: Inspect exact unsigned application and installer bytes
        env:
          NOVA_RELEASE_INSPECTION_DIAGNOSTICS: "1"
        run: npm run inspect:release-package --workspace @nova-audio-agent/ambient-orb
      - name: Normalize closed release artifact names and final digests
        run: npm run collect:release-artifacts --workspace @nova-audio-agent/ambient-orb -- --target-id ${{ matrix.target_id }}
      - name: Prepare checkout-free installed smoke kit
        run: npm run prepare:release-smoke-kit --workspace @nova-audio-agent/ambient-orb
      - name: Add portable unsigned result classifier to checkout-free kit
        run: node -e "require('node:fs').copyFileSync('desktop/ambient-orb/scripts/run-unsigned-installed-smoke.mjs','desktop/ambient-orb/build/release-smoke-kit/scripts/run-unsigned-installed-smoke.mjs')"
      # This is a same-workflow debugging artifact, not a release candidate.
      # The private repository's current plan does not provide attestations;
      # the downstream job still rehashes the closed bytes before execution.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/ambient-orb/build/release-artifacts/**
            desktop/ambient-orb/build/release-digests/**
            desktop/ambient-orb/build/release-smoke-kit/**
          if-no-files-found: error

  installed-smoke:
    needs: package
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win32-x64:nsis
            artifact_name: unsigned-win32-x64
            filename: nova-audio-agent-0.1.0-windows-x64.exe
            command: node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: candidate
      - name: Rehash, install, authenticate, exercise, quit, and remove candidate
        timeout-minutes: 10
        env:
          NOVA_RELEASE_SMOKE_DIAGNOSTICS: "1"
        run: >-
          ${{ matrix.command }} candidate/release-smoke-kit/scripts/run-unsigned-installed-smoke.mjs
          --target ${{ matrix.target }}
          --artifact candidate/release-artifacts/${{ matrix.filename }}
          --sha256-file candidate/release-digests/${{ matrix.filename }}.sha256
          --camera-file candidate/release-smoke-kit/cat-sofa-guard.mp4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installed-smoke
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-win32-x64
          path: candidate
      - name: Create GitHub Release from the installed-smoke-approved bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installer = @(Get-ChildItem 'candidate/release-artifacts/*.exe')
          $digest = @(Get-ChildItem 'candidate/release-digests/*.exe.sha256')
          if ($installer.Count -ne 1 -or $digest.Count -ne 1) {
            throw 'Expected exactly one Windows installer and SHA-256 digest.'
          }
          gh release create "$env:GITHUB_REF_NAME" `
            $($installer[0].FullName) `
            $($digest[0].FullName) `
            --verify-tag `
            --title "Nova Audio Agent $env:GITHUB_REF_NAME" `
            --notes "Unsigned Windows x64 installer. Windows SmartScreen may warn because this build is not code-signed."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }

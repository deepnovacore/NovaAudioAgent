name: AI PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review / 要审查的 PR 编号'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Opt in only after creating a dedicated, capped OpenRouter key.
    if: vars.PR_REVIEW_ENABLED == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      plan: ${{ steps.prepare.outputs.result }}
      message: ${{ steps.codex.outputs.final-message }}
    steps:
      # All executable code/prompts come from the trusted workflow revision.
      # Never check out a PR head under pull_request_target.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check eligibility and skip duplicate reviews
        id: prepare
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
        with:
          script: |
            const { prepare } = require('./.github/scripts/pr-review.cjs');
            const plan = await prepare({ github, context });
            core.setOutput('run', plan.run);
            if (plan.reason) core.notice(plan.reason);
            return plan;
      - name: Fetch PR objects without executing or checking out PR code
        if: steps.prepare.outputs.run == 'true'
        env:
          REVIEW_NUMBER: ${{ fromJSON(steps.prepare.outputs.result).number }}
          REVIEW_HEAD: ${{ fromJSON(steps.prepare.outputs.result).head }}
          REVIEW_BASE: ${{ fromJSON(steps.prepare.outputs.result).base }}
        run: |
          git -c core.hooksPath=/dev/null fetch --no-tags origin "+refs/pull/$REVIEW_NUMBER/head:refs/remotes/origin/review-head"
          test "$(git rev-parse refs/remotes/origin/review-head)" = "$REVIEW_HEAD"
          git -c core.hooksPath=/dev/null fetch --no-tags origin "$REVIEW_BASE"
          git cat-file -e "$REVIEW_BASE^{commit}"
          {
            cat .github/codex/review.md
            printf '\nPR number: %s\nBASE_SHA: %s\nHEAD_SHA: %s\nRepository: %s\n' \
              "$REVIEW_NUMBER" "$REVIEW_BASE" "$REVIEW_HEAD" "$GITHUB_REPOSITORY"
          } > "$RUNNER_TEMP/nova-review-prompt.md"
      - name: Prepare an isolated review user without changing runner services
        if: steps.prepare.outputs.run == 'true'
        run: |
          sudo useradd --create-home --user-group --shell /bin/bash nova-review
          sudo chmod 755 /home/nova-review
          sudo install -d -o nova-review -g nova-review -m 755 /home/nova-review/.codex
          sudo install -o root -g root -m 644 .github/codex/config.toml /home/nova-review/.codex/config.toml
          # The proxy starts as runner; the action locks this file before Codex starts.
          sudo touch "/home/nova-review/.codex/$GITHUB_RUN_ID.json"
          sudo chmod 666 "/home/nova-review/.codex/$GITHUB_RUN_ID.json"
          # Only the public checkout is shared; ancestor directories need traversal only.
          chmod -R a+rX "$GITHUB_WORKSPACE"
          chmod o+x /home/runner "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE/../.."
          sudo -u nova-review git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(id -Gn nova-review)" = nova-review
          sudo -u nova-review test -r "$GITHUB_WORKSPACE/.git/HEAD"
          if sudo -u nova-review sudo -n true 2>/dev/null || sudo -u nova-review test -w "$GITHUB_WORKSPACE"; then
            echo 'Review user must have neither sudo nor checkout write access.' >&2
            exit 1
          fi
      - name: Review diff and its wider impact through OpenRouter
        if: steps.prepare.outputs.run == 'true'
        id: codex
        timeout-minutes: 15
        # Temporary pin to the stdio lifecycle fix in openai/codex-action#151.
        # Do not recover output from failed runs.
        uses: openai/codex-action@f93255fd2e5a17a0b4bd557599535e80c8607537
        with:
          codex-version: '0.156.1'
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          responses-api-endpoint: https://openrouter.ai/api/v1/responses
          model: ${{ fromJSON(steps.prepare.outputs.result).model }}
          effort: medium
          safety-strategy: unprivileged-user
          codex-user: nova-review
          permission-profile: ':read-only'
          # Match sudo's default HOME instead of relying on preserved CODEX_HOME.
          codex-home: /home/nova-review/.codex
          prompt-file: ${{ runner.temp }}/nova-review-prompt.md
          codex-args: '["--ephemeral"]'

  publish:
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Update one comment only if the reviewed revision is still current
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_PLAN: ${{ needs.review.outputs.plan }}
          REVIEW_MESSAGE: ${{ needs.review.outputs.message }}
        with:
          script: |
            const { publish } = require('./.github/scripts/pr-review.cjs');
            await publish({ github, context, plan: JSON.parse(process.env.REVIEW_PLAN), message: process.env.REVIEW_MESSAGE });

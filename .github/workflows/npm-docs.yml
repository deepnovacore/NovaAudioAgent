name: Publish npm documentation
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: New npm-only documentation patch version
        required: true
        default: "0.3.2"
        type: string
permissions:
  contents: read
concurrency:
  group: npm-documentation
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'deepnovacore/NovaAudioAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Test and compare with the published package
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          npm test --prefix cli
          # Keep the source version aligned with the desktop release. Only the
          # audited npm documentation tarball receives a separate patch version.
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from "node:fs";
          const path = "cli/package.json";
          const pkg = JSON.parse(readFileSync(path, "utf8"));
          if (!/^\d+\.\d+\.\d+$/.test(process.env.PACKAGE_VERSION)) throw new Error("Invalid stable version");
          pkg.version = process.env.PACKAGE_VERSION;
          writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          JS
          mkdir previous candidate smoke
          npm pack nova-audio-agent@latest --pack-destination previous
          npm pack ./cli --pack-destination candidate
          tar -xzf previous/*.tgz -C previous
          tar -xzf candidate/*.tgz -C candidate
          python3 - <<'PY'
          import json
          from pathlib import Path
          before, after = Path('previous/package'), Path('candidate/package')
          files = lambda root: {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert files(before) == files(after), 'Package file list changed'
          for name in files(before):
              if name == 'README.md':
                  continue
              if name == 'package.json':
                  old = json.loads((before/name).read_text())
                  new = json.loads((after/name).read_text())
                  old_version, new_version = old.pop('version'), new.pop('version')
                  a, b = list(map(int, old_version.split('.'))), list(map(int, new_version.split('.')))
                  assert b == [a[0], a[1], a[2] + 1], 'Expected one documentation patch increment'
                  old.pop('homepage', None)
                  new.pop('homepage', None)
                  assert old == new, 'Non-documentation package metadata changed'
              else:
                  assert (before/name).read_bytes() == (after/name).read_bytes(), f'Executable payload changed: {name}'
          print('Only README, homepage and patch version differ from npm latest')
          PY
          npm install --prefix smoke --ignore-scripts ./candidate/*.tgz
          test "$(smoke/node_modules/.bin/novaaudio --version)" = "$(node --input-type=module -e "import {PRODUCT_VERSION} from './cli/src/target.mjs'; console.log(PRODUCT_VERSION)")"
          smoke/node_modules/.bin/novaaudio --help
      - name: Publish the audited tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./candidate/*.tgz --access public
      - name: Verify registry version and README
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const local = JSON.parse(readFileSync('cli/package.json', 'utf8'));
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch('https://registry.npmjs.org/nova-audio-agent');
            const registry = await response.json();
            if (registry['dist-tags'].latest === local.version && registry.readme?.trim() === readFileSync('cli/README.md', 'utf8').trim()) {
              console.log(`Verified npm ${local.version} and README`);
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          assert.fail('Registry propagation not verified; inspect before retrying publication');
          JS

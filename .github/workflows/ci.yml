name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
        # The complete runtime suite asserts POSIX uid/mode and descriptor-lock
        # contracts. Windows is covered by the desktop/native suite below and
        # by the checkout-free installed NSIS smoke in unsigned-packages.yml.
        if: runner.os != 'Windows'
      # npm may restore the Electron package without its platform binary from
      # cache. The pinned install script is idempotent and closes that gap.
      - run: node desktop/ambient-orb/node_modules/electron/install.js
      - run: npm run test:desktop
      - run: npm run build

  package:
    needs: electron
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac:candidate
            artifact: ambient-orb-mac
          - os: ubuntu-latest
            script: package:linux
            artifact: ambient-orb-linux
          - os: windows-latest
            script: package:win
            artifact: ambient-orb-win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - run: npm run inspect:release-package --workspace @nova-audio-agent/ambient-orb
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/ambient-orb/dist/**
          if-no-files-found: error

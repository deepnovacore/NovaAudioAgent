name: CI

# Temporary manual-only debugging mode. Restore automatic triggers only after
# cross-platform CI is explicitly re-enabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      # Temporary Windows-only debugging mode. Restore the other runners only
      # after cross-platform CI is explicitly re-enabled.
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NOVA_AUDIO_AGENT_TEST_TIME_BUDGET: "14.0"
      NOVA_AUDIO_AGENT_FIXTURE_REPLAY_BUDGET: "6.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv build
      - run: uv run nova-audio-agent --help

  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
      - run: npm run test:desktop
      - run: npm run build

  package:
    needs: electron
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            artifact: ambient-orb-win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - run: npm run inspect:release-package --workspace @nova-audio-agent/ambient-orb
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/ambient-orb/dist/**
          if-no-files-found: error

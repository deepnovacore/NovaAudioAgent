name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      NOVA_AUDIO_AGENT_TEST_TIME_BUDGET: "7.5"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv build
      - run: uv run nova-audio-agent --help

  electron:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/ambient-orb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ambient-orb/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

name: CI

on:
  push:
    branches: ["main", "v0.2.0dev"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  release-readiness:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check:release-gate

  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
        if: runner.os != 'Windows'
      - run: npm run test:runtime:win
        if: runner.os == 'Windows'
      - run: npm run test:cli
      # npm may restore the Electron package without its platform binary from
      # cache. The pinned install script is idempotent and closes that gap.
      - run: node desktop/ambient-orb/node_modules/electron/install.js
      - run: npm run test:desktop
      - run: npm run smoke:capability-status --workspace @nova-audio-agent/ambient-orb
        if: runner.os == 'macOS'
      - run: npm run build

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    # Build candidate artifacts independently; release-publish enforces acceptance before publishing.
    needs: [electron]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac:candidate
            artifact: ambient-orb-mac
          - os: windows-latest
            script: package:win
            artifact: ambient-orb-win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - run: npm run inspect:release-package --workspace @nova-audio-agent/ambient-orb
        env:
          NOVA_RELEASE_INSPECTION_DIAGNOSTICS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/ambient-orb/dist/**
          if-no-files-found: error

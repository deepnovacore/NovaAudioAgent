name: CI

on:
  push:
    branches: ["main", "v0.2.0dev", "v0.3.0dev"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  review-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/scripts/pr-review.test.cjs

  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
        if: runner.os != 'Windows'
      # Full runtime regression runs on macOS/Linux; Windows keeps platform
      # coverage plus the desktop/native/installer acceptance below.
      - run: npm run test:runtime:win:platform
        if: runner.os == 'Windows'
      - run: npm run test:live:contract --workspace @nova-audio-agent/runtime
      - run: npm run test:server-cli
      - run: npm run test:cli
      # npm may restore the Electron package without its platform binary from
      # cache. The pinned install script is idempotent and closes that gap.
      - run: node clients/desktop/node_modules/electron/install.js
      - name: Configure Linux V8 header compatibility
        if: runner.os == 'Linux'
        run: echo "CXXFLAGS=-UV8_DEPRECATION_WARNINGS" >> "$GITHUB_ENV"
      - run: npm run test:desktop
      - run: npm run smoke:capability-status --workspace @nova-audio-agent/desktop
        if: runner.os == 'macOS'
      - run: npm run build
      - name: Verify installed headless npm package
        if: runner.os == 'Linux'
        run: |
          umask 077
          tarball="$(node scripts/pack-server.mjs server-candidate)"
          npm install --prefix server-smoke "$tarball"
          node scripts/verify-server-package.mjs server-smoke/node_modules/.bin/novaaudio-server

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    # Build candidate artifacts independently; release-publish enforces acceptance before publishing.
    needs: [electron]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac:candidate
            artifact: nova-audio-agent-desktop-mac
          - os: windows-latest
            script: package:win
            artifact: nova-audio-agent-desktop-win
          - os: ubuntu-22.04
            script: package:linux
            artifact: nova-audio-agent-desktop-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Prepare Linux packaging
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y g++-12 xvfb libasound2 libgtk-3-0 libnss3 libgbm1 libsecret-1-0
          echo "CXX=g++-12" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-UV8_DEPRECATION_WARNINGS" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.script }}
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} npm run verify:release --workspace @nova-audio-agent/desktop -- --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: clients/desktop/dist/**
          if-no-files-found: error
